[project]
name = "plantrade"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8",
  "pydantic-settings>=2.2",
  "requests>=2.31",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "jieba>=0.42",
  "matplotlib>=3.9",
  "numpy<2",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
data   = ["akshare==1.16.98", "PyMuPDF>=1.24"]   # 备选数据源 / 巨潮 PDF 正文
legacy = ["streamlit>=1.30"]        # 仅 ui/ 旧骨架；正式界面是 FastAPI + 单 HTML
dev    = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
include = ["config*","contracts*","tools*","llm*","observability*","memory*","data*","research*","agents*","adapt*","guardrails*","pipeline*","ui*","eval*","scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]